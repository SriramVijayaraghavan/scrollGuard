<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScrollGuard</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#050a18">
<style>
/* Layout concept: iOS grouped-list rhythm. One column, large title, grouped cards, bottom tab bar.
   Palette: cool graphite neutrals + a user-selectable accent (default emerald). Chart colors validated for CVD. */
:root{
  --bg:#f1f3f8;--card:#fff;--fill:#e9edf5;--tx:#0a1430;--mu:#69707d;--line:rgba(14,17,22,.09);--off:#d3d7de;
  --accent:#122a6b;--accent-t:#122a6b;--ink:#fff;--danger:#d92d3a;--ok:#12805c;--warn:#b7791f;
  --c-instagram:#d55181;--c-tiktok:#2a78d6;--c-youtube:#eb6834;--c-other:#898781;
  --shadow:0 1px 2px rgba(14,17,22,.05);--segon:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050a18;--card:#0b1630;--fill:#142040;--tx:#f3f5fa;--mu:#8f9bb5;--line:rgba(255,255,255,.09);--off:#2c3a5c;
  --ok:#3ccf9c;--warn:#e0a84a;--danger:#ff6b76;--shadow:none;--segon:#1f2e58;
  --c-instagram:#d55181;--c-tiktok:#3987e5;--c-youtube:#d95926;--c-other:#898781;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050a18;--card:#0b1630;--fill:#142040;--tx:#f3f5fa;--mu:#8f9bb5;--line:rgba(255,255,255,.09);--off:#2c3a5c;
  --ok:#3ccf9c;--warn:#e0a84a;--danger:#ff6b76;--shadow:none;--segon:#1f2e58;
  --c-instagram:#d55181;--c-tiktok:#3987e5;--c-youtube:#d95926;--c-other:#898781;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.page{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
h1,h2,h3,p{margin:0}
h1,h2,h3,.bal{text-wrap:balance}
p,.sub{text-wrap:pretty}
svg.i{display:block;flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 16px}
.top h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;box-shadow:var(--shadow);flex:none;cursor:pointer}
.section-t{font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}

/* grouped list */
.group{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.group>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;min-height:52px}
.lbl{min-width:0;flex:1}
.lbl b{font-weight:500;display:block}
.sub{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--mu);padding:0 6px 14px}

/* controls */
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--off);position:relative;flex:none;margin:0;border:0;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent-t)}.sw:checked::after{transform:translateX(20px)}
.ck{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--off);margin:0;flex:none;position:relative;cursor:pointer}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:14px;font-weight:500;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.field{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--fill);border:0;border-radius:12px;padding:13px 14px;outline:none;min-width:0}
.field:focus{box-shadow:0 0 0 2px var(--accent-t)}
input[type=time].field{width:auto;padding:8px 10px}
textarea.field{min-height:84px;resize:vertical}
.dtl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu);min-width:0}
input.field.dtf{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;height:48px;padding:0 12px;text-align:left;line-height:48px}
input.field.dtf::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.btn{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:14px;padding:14px 18px;background:var(--fill);color:var(--tx);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:10px}
.link{white-space:nowrap;border:0;background:none;color:var(--accent-t);font:inherit;font-weight:600;padding:8px;cursor:pointer}
.days{display:flex;gap:6px;justify-content:space-between}
.days button{width:38px;height:38px;border-radius:50%;border:0;background:var(--fill);color:var(--tx);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.days button.on{background:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.swatches{display:flex;gap:14px}
.swatches button{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;position:relative}
.swatches button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tx)}
.err{color:var(--danger);font-size:14px;text-align:center}
.err:empty{display:none}

/* home */
.approw{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:14px 16px;cursor:pointer}
.approw .lbl b{font-weight:600;font-size:17px}
.logo{border-radius:11px;box-shadow:0 0 0 1px var(--line);flex:none}
.lock-ic{color:var(--warn)}
.chev{color:var(--mu)}
.days3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 16px 6px;align-items:end}
.d3{text-align:center}
.d3 .bar{height:56px;display:flex;align-items:flex-end;justify-content:center}
.d3 .bar i{display:block;width:34px;background:var(--accent-t);border-radius:6px 6px 3px 3px;min-height:4px}
.d3 .v{font-weight:700;font-size:17px;margin-top:8px;font-variant-numeric:tabular-nums}
.d3 .l{font-size:12px;color:var(--mu)}
.blurb{padding:6px 16px 16px;color:var(--mu);font-size:15px}
.banner{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));z-index:20}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--accent-t)}

/* full-page sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right));animation:up .26s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.sw,.sw::after{transition:none}}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;text-align:center}
.sheet .lead{text-align:center;color:var(--mu);font-size:17px}
.sheet .lead b{color:var(--tx)}
.mark{display:grid;place-items:center;padding:10px 0 4px}

.pause{z-index:60}
.pause-in{min-height:calc(100vh - 60px);justify-content:center;text-align:center}
.ring{position:relative;width:136px;height:136px;margin:4px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--fill);stroke-width:9}
.rp{fill:none;stroke:var(--accent-t);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.7;transition:stroke-dashoffset .3s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.rp{transition:none}}

/* welcome */
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:400px;margin:0 auto;padding:24px 0}
.welcome h1{font-size:32px;line-height:1.12;letter-spacing:-.02em;text-align:center}
.welcome .lead{text-align:center;color:var(--mu)}
.fields{display:flex;flex-direction:column;gap:10px}
.fine{font-size:13px;color:var(--mu);text-align:center}

/* tasks / learn */
.task{display:flex;align-items:center;gap:14px;padding:12px 16px}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{color:var(--mu);text-decoration:line-through}
.x{border:0;background:none;color:var(--mu);padding:6px;cursor:pointer;display:grid;place-items:center}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--fill);color:var(--tx);border:0;font:inherit;border-radius:99px;padding:10px 12px 10px 15px;font-size:15px;min-height:40px;cursor:pointer}
.pill svg{color:var(--mu)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.kicker{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.card h3{font-size:19px;line-height:1.25;margin-bottom:8px}
.card img{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.card p{color:var(--tx);font-size:16px;line-height:1.5}
.card a{color:var(--accent-t);font-weight:600;font-size:15px;text-decoration:none;display:inline-block;margin-top:10px}
.card iframe{width:100%;aspect-ratio:9/16;max-height:70vh;border:0;border-radius:12px;display:block}
.center{text-align:center;color:var(--mu);padding:20px}

/* history */
.chart{padding:14px 12px 10px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--mu);font-size:11px;font-family:inherit}
.grid{stroke:var(--line);stroke-width:1}
.s-instagram{fill:var(--c-instagram)}.s-tiktok{fill:var(--c-tiktok)}.s-youtube{fill:var(--c-youtube)}.s-other{fill:var(--c-other)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:6px 16px 14px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums}
.hbar{padding:10px 16px}
.hbar .h{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.hbar .h span:last-child{color:var(--mu);font-variant-numeric:tabular-nums}
.hbar .tr{height:10px;background:var(--fill);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 8px;text-align:center}
.hero .you{color:var(--mu);font-size:15px}
.hero .name{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.badge-art{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:8px 0 4px;color:var(--ink)}
.trow{display:flex;align-items:center;gap:14px;padding:12px 16px;opacity:.55}
.trow.on{opacity:1;background:var(--fill)}
.ti{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.bar-p{height:8px;background:var(--fill);border-radius:5px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pet-row{display:flex;align-items:center;gap:16px;padding:16px}
.pet-row .lbl b{font-size:17px;font-weight:700}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fdc468"/><stop offset=".3" stop-color="#f77737"/><stop offset=".55" stop-color="#dd2a7b"/><stop offset="1" stop-color="#515bd4"/></linearGradient>
</defs></svg>
<main id="app" class="page"></main>
<nav id="nav" hidden></nav>
<script src="app.js?v=2026-10-16.6"></script>
</body></html>
